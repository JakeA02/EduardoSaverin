[project]
name = "natgas"
version = "0.1.0"
description = "Weather-driven US natural gas storage forecasting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "herbie-data>=2024.12.0",
    "joblib>=1.4.0",
    "lightgbm>=4.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "polars>=1.9.0",
    "pyarrow>=17.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "rich>=13.9.0",
    "scikit-learn>=1.5.0",
    "statsmodels>=0.14.0",
    "typer>=0.12.0",
    "xarray>=2024.10.0",
    "cfgrib>=0.9.14",
    "yfinance>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[project.scripts]
natgas = "natgas.cli:app"
kalshi-wx = "kalshi_wx.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["natgas", "kalshi_wx"]

[tool.hatch.build.targets.wheel.force-include]
"kalshi_wx/static/dashboard.html" = "kalshi_wx/static/dashboard.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
