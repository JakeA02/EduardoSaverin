name: Forecast Pipeline

on:
  schedule:
    # ~90 min after 00/06/12/18Z GFS cycles
    - cron: "30 2,8,14,20 * * *"
    # Consensus typically prints Tuesday–Wednesday; extra pass before the EIA 10:30 ET release
    - cron: "0 12,14,16 * * 2,3,4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Init and ingest
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          uv run natgas init-db
          uv run natgas ingest eia
          uv run natgas ingest cpc
          uv run natgas ingest cpc-forecast --start-year 2024
          uv run natgas ingest consensus
          uv run natgas build-panel

      - name: Train, predict, and paper-trade
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          uv run natgas train
          uv run natgas predict --source all
          uv run natgas paper --hindcast

      - name: Refresh dashboard
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: uv run natgas dashboard

      - name: Kalshi weather scan and dashboard
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if uv run kalshi-wx scan; then
            echo "Kalshi weather scan ok"
          else
            echo "::warning::Kalshi weather scan failed or skipped; writing dashboard from last log."
          fi
          uv run kalshi-wx dashboard

      - name: Commit logs, consensus, and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/predictions/ logs/kalshi/ data/consensus/ data/paper/ dashboard/
          git diff --staged --quiet || git commit -m "ops: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Deploy dashboard to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            npx vercel@41 deploy --prod --yes --token "$VERCEL_TOKEN"
          elif [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -sf -X POST "$VERCEL_DEPLOY_HOOK"
            echo "Triggered Vercel deploy hook."
          else
            echo "::warning::Set VERCEL_TOKEN (and org/project ids) or VERCEL_DEPLOY_HOOK for dashboard deploys."
          fi
