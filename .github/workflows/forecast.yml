name: Forecast Pipeline

on:
  schedule:
    # ~90 min after 00/06/12/18Z GFS cycles
    - cron: "30 2,8,14,20 * * *"
    # Consensus typically prints Tuesday–Wednesday; extra pass before the EIA 10:30 ET release
    - cron: "0 12,14,16 * * 2,3,4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Init and ingest
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          uv run natgas init-db
          uv run natgas ingest eia
          uv run natgas ingest cpc
          uv run natgas ingest cpc-forecast --start-year 2024
          uv run natgas ingest consensus || echo "consensus ingest skipped"
          uv run natgas build-panel

      - name: Train and predict (forecast weather)
        run: |
          uv run natgas train
          uv run natgas predict --source cpc-forecast

      - name: Refresh dashboard
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: uv run natgas dashboard

      - name: Commit logs, consensus, and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/predictions/ data/consensus/ dashboard/
          git diff --staged --quiet || git commit -m "ops: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Deploy dashboard to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN unset; dashboard is in git. Connect the GitHub repo in Vercel to auto-deploy."
            exit 0
          fi
          npx vercel@41 deploy --prod --yes --token "$VERCEL_TOKEN"
