# Fly.io — always-on backend for APScheduler (BTC + weather scans).
# First deploy: ./fly-deploy.sh  (creates app, volume, secrets, deploys)
#
# Replace app name on first `fly launch` if eduardo-weather-bot is taken.
app = "eduardo-weather-bot"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "sqlite:////data/tradingbot.db"
  SIMULATION_MODE = "true"

[mounts]
  source = "tradingbot_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
